<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171B24">
    <title>Сценарии</title>
    <link rel="stylesheet" href="/static/styles/scenarios.css">
</head>
<body>
    <div class="scenarios-container">
        <div class="search-bar">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--color-text-muted)" stroke-width="2">
                <circle cx="8" cy="8" r="6"/>
                <line x1="13" y1="13" x2="18" y2="18"/>
            </svg>
            <form action="/scenarios" method="GET" class="search-form">
                <input type="search" name="filter" value="{{ .filter }}" placeholder="Поиск по названию..." aria-label="Поиск по названию сценария" enterkeyhint="search" class="search-input">
            </form>
        </div>

        <div class="scenarios-grid">
            {{ range .scenarios }}
            <a href="/feed/{{ .ID }}" class="scenario-card">
                <div class="card-image">
                    <img src="{{ .ImageURL }}" alt="{{ .Name }}">
                </div>
                <div class="card-info">
                    <h3 class="card-title">{{ .Name }}</h3>
                    <p class="card-capacity">Ёмкость = {{ .BatteryCapacity }} мА*ч</p>
                    <div class="card-likes">
                        <svg width="14" height="12" viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1.56479 2.39991C1.19694 2.93478 1.00001 3.56865 1 4.21779C1 5.55947 1.87507 6.55114 2.75013 7.42615L5.96338 10.5365C6.07366 10.66 6.20894 10.7585 6.36025 10.8257C6.51155 10.8928 6.67542 10.927 6.84095 10.926C7.00649 10.9249 7.1699 10.8887 7.32035 10.8196C7.47079 10.7506 7.60481 10.6503 7.71352 10.5254L10.9174 7.42615C11.7925 6.55114 12.6676 5.55363 12.6676 4.21779C12.6707 3.56722 12.4755 2.93115 12.1082 2.39421C11.7408 1.85728 11.2186 1.44496 10.6111 1.21212C10.0036 0.979291 9.33953 0.936993 8.70738 1.09086C8.07522 1.24472 7.50492 1.58745 7.07238 2.07343C7.04182 2.10611 7.00487 2.13216 6.96383 2.14997C6.92279 2.16778 6.87852 2.17697 6.83378 2.17697C6.78904 2.17697 6.74478 2.16778 6.70373 2.14997C6.66269 2.13216 6.62574 2.10611 6.59518 2.07343C6.16128 1.59059 5.59111 1.25072 4.95998 1.0987C4.32885 0.946681 3.66645 0.989671 3.06026 1.22199C2.45408 1.45431 1.93263 1.86503 1.56479 2.39991Z" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span>{{ .LikesCount }}</span>
                    </div>
                </div>
            </a>
            {{ else }}
            <p class="search-empty" role="status">Сценарии не найдены</p>
            {{ end }}
        </div>

        <nav class="bottom-tab-bar">
            <div class="tabs">
                <a href="/" class="tab">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <polygon points="10,8 16,12 10,16"/>
                    </svg>
                    <span>Лента</span>
                </a>
                <a href="/add" class="tab">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Добавить</span>
                </a>
                <a href="/scenarios" class="tab active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5">
                        <rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 2v3h6V2"/>
                    </svg>
                    <span>Сценарии</span>
                </a>
            </div>
        </nav>
    </div>
</body>
</html>
